name: Build Router Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev file rsync bc git wget cpio unzip

    - name: Download Buildroot via Tarball
      run: |
        wget https://buildroot.org
        tar -xf buildroot-2024.02.10.tar.xz
        mv buildroot-2024.02.10 buildroot
        
    - name: Configure and Compile Custom OS
      run: |
        cd buildroot
        # Initialize default architecture target configuration
        make qemu_arm_versatile_defconfig
        
        # Safely enable Python and necessary networking features using Buildroot configuration utilities
        ./support/kconfig/merge_config.sh -m .config <(echo "
        BR2_PACKAGE_PYTHON3=y
        BR2_PACKAGE_PYTHON_REQUESTS=y
        BR2_PACKAGE_CURL=y
        BR2_PACKAGE_OPENSSL=y
        ")
        
        # Re-verify and resolve missing defaults cleanly
        make olddefconfig
        make -j$(nproc)

    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: custom-firmware
        path: buildroot/output/images/
